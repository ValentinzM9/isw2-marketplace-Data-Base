name: Validación de scripts SQL

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-sql:
    name: Verificar scripts SQL
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v7

      - name: Verificar scripts SQL
        run: |
          files=(
            "01_create_tables.sql"
            "02_primary_unique_constraints.sql"
            "03_indexes.sql"
            "04_foreign_keys.sql"
          )

          for file in "${files[@]}"; do
            if [ ! -f "$file" ]; then
              echo "::error::No se encontró el archivo: $file"
              exit 1
            fi

            if [ ! -s "$file" ]; then
              echo "::error::El archivo está vacío: $file"
              exit 1
            fi

            echo "OK: $file"
          done

          echo "Todos los scripts SQL fueron verificados correctamente."
